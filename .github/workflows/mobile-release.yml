name: Mobile Release (Android APK)

# Triggered by pushing a version tag, e.g.:
#   git tag v0.0.1 && git push origin v0.0.1
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    environment: prod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is not in vX.Y.Z form" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Set app version and Android version code
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('./app.json', 'utf8'));
            config.expo.version = process.env.APP_VERSION;
            config.expo.android.versionCode = Number(process.env.VERSION_CODE);
            fs.writeFileSync('./app.json', JSON.stringify(config, null, 2) + '\n');
          "

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK on EAS
        id: build
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > eas-build-result.json
          cat eas-build-result.json
          BUILD_URL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('eas-build-result.json','utf8'))[0].artifacts.buildUrl)")
          if [ -z "$BUILD_URL" ] || [ "$BUILD_URL" = "undefined" ]; then
            echo "Could not find a build artifact URL in the EAS build result" >&2
            exit 1
          fi
          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_URL: ${{ steps.build.outputs.build_url }}
        run: |
          curl -fL -o "timekeeper-${APP_VERSION}.apk" "$BUILD_URL"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TimeKeeper v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: mobile/timekeeper-${{ steps.version.outputs.version }}.apk
